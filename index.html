<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Neon Breaker</title>
  <style>
    :root{--bg:#080a18;--ink:#edf3ff;--muted:#8992b7;--cyan:#52f6ff;--pink:#ff4fd8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#202458 0,#0b0e24 42%,#050610 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
    body{display:grid;place-items:center;padding:18px;overflow:hidden}.shell{width:min(1100px,100%);display:grid;gap:12px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{letter-spacing:.18em;font-weight:800;font-size:clamp(13px,2vw,18px);color:var(--cyan);text-shadow:0 0 14px #52f6ff99}.brand span{color:var(--pink)}.stats{display:flex;gap:18px;align-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.stats b{font-size:17px;color:var(--ink);margin-left:4px}.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid #ffffff22;border-radius:18px;background:#070916;box-shadow:0 0 0 1px #52f6ff12,0 20px 70px #0009,0 0 42px #5b43ff22}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 50%,#ffffff04 50%);background-size:100% 5px;mix-blend-mode:screen;opacity:.3}.stage canvas{display:block;width:100%;height:100%;touch-action:none}.screen{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:28px;background:#05061599;backdrop-filter:blur(8px);z-index:2}.screen[hidden]{display:none}.panel{max-width:530px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.28em;text-transform:uppercase}.panel h1{margin:10px 0 8px;font-size:clamp(34px,8vw,74px);line-height:.95;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 0 24px #ff4fd888}.panel p{margin:0 auto 22px;color:#c0c6e2;line-height:1.6;font-size:clamp(13px,2vw,16px)}button{border:1px solid #52f6ff99;border-radius:999px;padding:13px 28px;background:linear-gradient(100deg,#52f6ff,#9271ff);color:#071021;font-weight:900;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 22px #52f6ff55;transition:transform .2s,filter .2s}button:hover{transform:translateY(-2px);filter:brightness(1.16)}.hint{margin-top:16px!important;color:var(--muted)!important;font-size:11px!important;letter-spacing:.1em}.footer{display:flex;justify-content:space-between;color:#646d96;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.footer kbd{border:1px solid #ffffff22;padding:3px 7px;border-radius:5px;color:#b4bbd8}@media(max-width:600px){body{padding:10px}.stage{border-radius:12px}.topbar{align-items:flex-start}.stats{gap:8px;font-size:10px}.stats b{font-size:14px}.footer{font-size:9px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand">NEON <span>BREAKER</span></div><div class="stats"><span>SCORE <b id="score">00000</b></span><span>BEST <b id="best">00000</b></span><span>LIVES <b id="lives">♥♥♥</b></span></div></header>
    <section class="stage" aria-label="Neon Breaker game board">
      <canvas id="game" width="960" height="540"></canvas>
      <div class="screen" id="screen"><div class="panel"><div class="eyebrow">Arcade protocol online</div><h1 id="screenTitle">Neon Breaker</h1><p id="screenText">Clear the grid. Catch power-ups. Keep the pulse alive.</p><button id="screenButton">Start game</button><p class="hint">Move with <b>A / D</b> or <b>← / →</b> · mouse / touch supported · <b>Esc</b> or <b>Space</b> pauses</p></div></div>
    </section>
    <footer class="footer"><span>16:9 SYNTHWAVE ARCADE</span><span><kbd>SPACE</kbd> pause</span></footer>
  </main>
  <script>
  'use strict';
  const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
  const $=s=>document.querySelector(s), scoreEl=$('#score'),bestEl=$('#best'),livesEl=$('#lives'),screen=$('#screen'),title=$('#screenTitle'),text=$('#screenText'),screenButton=$('#screenButton');
  const colors=['#ff4fda','#ff6f8f','#ffad5a','#ffe55c','#64f5a3','#52f6ff'];
  const keys=new Set(); let state='ready',score=0,lives=3,best=Number(localStorage.getItem('neon-breaker-best')||0),last=0,shake=0;
  const balls=[],bricks=[],particles=[],powerups=[];
  const rand=(a,b)=>a+Math.random()*(b-a), clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
  // Tiny procedural synth: no audio files or libraries required.
  class AudioFX{constructor(){this.ctx=null}unlock(){if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C()}if(this.ctx.state==='suspended')this.ctx.resume()}tone(freq,duration=.08,type='square',volume=.045,slide=0,delay=0){if(!this.ctx)return;const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+duration+.02)}paddle(position){this.unlock();this.tone(220+Math.abs(position)*150,.07,'square',.035,position*80)}brick(row){this.unlock();this.tone(320+row*55,.09,'triangle',.04,90);this.tone(640+row*70,.06,'square',.025,-120, .035)}gameOver(){this.unlock();[180,145,110,75].forEach((n,i)=>this.tone(n,.18,'sawtooth',.045,-20,i*.13))}victory(){this.unlock();[440,554,659,880].forEach((n,i)=>this.tone(n,.14,'triangle',.04,0,i*.09))}}
  const audio=new AudioFX();
  class Paddle{constructor(){this.w=142;this.base=142;this.h=15;this.x=(W-this.w)/2;this.y=H-45;this.target=this.x;this.wide=0}reset(){this.w=this.base;this.x=(W-this.w)/2;this.target=this.x;this.wide=0}update(dt){if(this.wide>0){this.wide-=dt;if(this.wide<=0)this.w=this.base}let v=520;if(keys.has('ArrowLeft')||keys.has('a'))this.target-=v*dt;if(keys.has('ArrowRight')||keys.has('d'))this.target+=v*dt;this.target=clamp(this.target,12,W-this.w-12);this.x+=(this.target-this.x)*Math.min(1,dt*16)}draw(){glow('#52f6ff');roundRect(ctx,this.x,this.y,this.w,this.h,8);ctx.fillStyle='#bffcff';ctx.fill();ctx.shadowBlur=0}}
  const paddle=new Paddle();
  class Ball{constructor(x=paddle.x+paddle.w/2,y=paddle.y-12,a=rand(-.8,.8)){this.x=x;this.y=y;this.r=8;this.speed=350;this.vx=Math.sin(a)*this.speed;this.vy=-Math.cos(a)*this.speed;this.stuck=true;this.dead=false}launch(){this.stuck=false}update(dt){if(this.stuck){this.x=paddle.x+paddle.w/2;this.y=paddle.y-this.r-2;return}this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.x<this.r+8){this.x=this.r+8;this.vx=Math.abs(this.vx)}if(this.x>W-this.r-8){this.x=W-this.r-8;this.vx=-Math.abs(this.vx)}if(this.y<this.r+8){this.y=this.r+8;this.vy=Math.abs(this.vy)}if(this.y>H+this.r)this.dead=true;const hit=paddle.y-this.r<this.y&&this.y<paddle.y+paddle.h&&this.x>paddle.x-this.r&&this.x<paddle.x+paddle.w+this.r&&this.vy>0;if(hit){const rel=clamp((this.x-(paddle.x+paddle.w/2))/(paddle.w/2),-1,1);this.y=paddle.y-this.r;this.vx=rel*470;this.vy=-Math.sqrt(Math.max(180*180,this.speed*this.speed-this.vx*this.vx));this.speed=Math.min(560,this.speed+2);this.vy=-Math.abs(this.vy);audio.paddle(rel)}}draw(){glow('#ffffff');ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.shadowBlur=0}}
  class Brick{constructor(x,y,w,h,row){this.x=x;this.y=y;this.w=w;this.h=h;this.row=row;this.alive=true;this.hp=1;this.color=colors[row%colors.length]}draw(){if(!this.alive)return;glow(this.color);roundRect(ctx,this.x,this.y,this.w,this.h,5);ctx.fillStyle=this.color;ctx.fill();ctx.fillStyle='#ffffff55';roundRect(ctx,this.x+3,this.y+3,this.w-6,3,2);ctx.fill();ctx.shadowBlur=0}}
  class Particle{constructor(x,y,color){this.x=x;this.y=y;this.vx=rand(-130,130);this.vy=rand(-160,70);this.life=rand(.35,.75);this.max=this.life;this.color=color;this.size=rand(2,5)}update(dt){this.life-=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=250*dt}draw(){ctx.globalAlpha=Math.max(0,this.life/this.max);ctx.fillStyle=this.color;ctx.fillRect(this.x,this.y,this.size,this.size);ctx.globalAlpha=1}}
  class PowerUp{constructor(x,y,type,color){this.x=x;this.y=y;this.type=type;this.color=color;this.vy=105;this.w=30;this.h=14}update(dt){this.y+=this.vy*dt;return this.y<H+30}draw(){glow(this.color);roundRect(ctx,this.x-this.w/2,this.y-this.h/2,this.w,this.h,7);ctx.fillStyle=this.color;ctx.fill();ctx.fillStyle='#071021';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(this.type==='wide'?'W':'×2',this.x,this.y);ctx.shadowBlur=0}}
  function glow(color){ctx.shadowColor=color;ctx.shadowBlur=18}
  function buildBricks(){bricks.length=0;const cols=10,rows=6,gap=8,bw=(W-92-gap*(cols-1))/cols;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push(new Brick(46+c*(bw+gap),65+r*28,bw,20,r))}
  function resetRound(){paddle.reset();balls.length=0;balls.push(new Ball());powerups.length=0}
  function newGame(){audio.unlock();score=0;lives=3;buildBricks();resetRound();state='playing';hideScreen();updateHud()}
  function updateHud(){scoreEl.textContent=String(score).padStart(5,'0');bestEl.textContent=String(best).padStart(5,'0');livesEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}
  function showScreen(t,sub,button){title.textContent=t;text.textContent=sub;screenButton.textContent=button;screen.hidden=false}
  function hideScreen(){screen.hidden=true}
  function loseLife(){lives--;balls.length=0;updateHud();shake=.3;if(lives<=0){state='over';audio.gameOver();showScreen('Game over','The grid outlasted you. Reset the run and try a sharper angle.','Play again')}else{resetRound();state='playing'}}
  function victory(){state='victory';best=Math.max(best,score);localStorage.setItem('neon-breaker-best',best);audio.victory();updateHud();showScreen('Victory','Every brick is dust. The neon is yours.','Play again')}
  function brickCollision(ball){for(const b of bricks){if(!b.alive)continue;const nx=clamp(ball.x,b.x,b.x+b.w),ny=clamp(ball.y,b.y,b.y+b.h),dx=ball.x-nx,dy=ball.y-ny;if(dx*dx+dy*dy<ball.r*ball.r){const prevX=ball.x-ball.vx*.016,prevY=ball.y-ball.vy*.016;if(prevY<=b.y||prevY>=b.y+b.h)ball.vy*=-1;else ball.vx*=-1;b.alive=false;score+=(6-b.row)*10;audio.brick(b.row);for(let i=0;i<rand(5,11);i++)particles.push(new Particle(ball.x,ball.y,b.color));if(Math.random()<.15)powerups.push(new PowerUp(b.x+b.w/2,b.y+b.h/2,Math.random()<.5?'wide':'multi',b.color));if(!bricks.some(x=>x.alive))victory();return}}}
  function updatePowerups(dt){for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];if(!p.update(dt)){powerups.splice(i,1);continue}if(p.y+p.h/2>paddle.y&&p.y-p.h/2<paddle.y+paddle.h&&p.x>paddle.x&&p.x<paddle.x+paddle.w){if(p.type==='wide'){paddle.w=220;paddle.target=clamp(paddle.target,12,W-paddle.w-12);paddle.wide=8}else{const source=balls[0];if(source){const extra=new Ball(source.x,source.y,Math.atan2(source.vx,-source.vy)+.65);extra.vx=source.vx*.75;extra.vy=source.vy;extra.stuck=false;balls.push(extra)}}powerups.splice(i,1);score+=50}}}
  function update(dt){paddle.update(dt);for(const b of balls)b.update(dt);for(const b of balls)if(!b.dead)brickCollision(b);for(let i=balls.length-1;i>=0;i--)if(balls[i].dead)balls.splice(i,1);if(!balls.length&&state==='playing')loseLife();for(let i=particles.length-1;i>=0;i--){particles[i].update(dt);if(particles[i].life<=0)particles.splice(i,1)}updatePowerups(dt);if(shake>0)shake-=dt;updateHud()}
  function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#070916';ctx.fillRect(0,0,W,H);const grd=ctx.createRadialGradient(W/2,H*.55,20,W/2,H*.55,W*.7);grd.addColorStop(0,'#1a1640');grd.addColorStop(1,'#070916');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff0a';ctx.lineWidth=1;for(let y=20;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.save();if(shake>0)ctx.translate(rand(-4,4),rand(-4,4));bricks.forEach(b=>b.draw());powerups.forEach(p=>p.draw());particles.forEach(p=>p.draw());balls.forEach(b=>b.draw());paddle.draw();ctx.restore()}
  function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;if(state==='playing')update(dt);draw();requestAnimationFrame(loop)}
  function pointerX(e){const r=canvas.getBoundingClientRect();return (e.clientX-r.left)/r.width*W}
  canvas.addEventListener('pointermove',e=>{paddle.target=clamp(pointerX(e)-paddle.w/2,12,W-paddle.w-12)});canvas.addEventListener('pointerdown',e=>{audio.unlock();if(state==='playing'){paddle.target=clamp(pointerX(e)-paddle.w/2,12,W-paddle.w-12);balls.forEach(b=>b.launch())}});
  window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowLeft','ArrowRight',' ','Escape','a','d'].includes(k))e.preventDefault();keys.add(k);if((k===' '||k==='Escape')&&state==='playing'){state='paused';showScreen('Paused','Take a breath. The grid is waiting.','Resume')}else if(k===' '&&state==='paused'){state='playing';hideScreen()}else if(k===' '&&state==='ready'){newGame()}else if(state==='playing'&&k===' ')balls.forEach(b=>b.launch())});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));screenButton.addEventListener('click',()=>{if(state==='paused'){state='playing';hideScreen()}else newGame()});
  buildBricks();resetRound();updateHud();requestAnimationFrame(loop);
  </script>
</body>
</html>
